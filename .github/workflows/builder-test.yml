---
name: Test Builds

"on":
  pull_request:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      amd64:
        type: boolean
        description: amd64
        required: false
        default: true
      aarch64:
        type: boolean
        description: aarch64
        required: false
        default: true

jobs:
  build:
    name: Test build

    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: 🤔 Determine which images to build
        id: build-args
        shell: bash
        run: |-
          args=()

          if [[ ${{ github.event_name }} == "pull_request" ]]; then
            args+=("--amd64" "--aarch64")  # Build both supported archs
          else
            if [[ "${{ github.event.inputs.aarch64 }}" == "true" ]]; then
              args+=("--aarch64")
            fi

            if [[ "${{ github.event.inputs.amd64 }}" == "true" ]]; then
              args+=("--amd64")
            fi
          fi

          echo "arguments=${args[@]}" >> $GITHUB_OUTPUT

      - name: 🚧 Test build
        # 2026.02.1
        uses: home-assistant/builder@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          args: |
            --test \
            --target ecowitt2mqtt \
            ${{ steps.build-args.outputs.arguments }}
